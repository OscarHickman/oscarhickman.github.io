<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="chrome=1" />
    <meta name="revisit-after" content="7 days" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-TileColor" content="#0e1013" />
    <meta name="theme-color" content="#0e1013" />
    <title>Oscar Hickman</title>
    <link rel="preload" href="/assets/fonts/stixtwotext-632f5705.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || (prefersDark ? 'dark' : 'light')
        document.documentElement.classList.toggle('dark', setting === 'dark')
      })()
    </script>
  </head>
  <body class="relative">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
